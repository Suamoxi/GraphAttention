[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-attention"
version = "0.1.0"
description = "Scientific machine learning for CFD fields on variable meshes."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch",
  "hydra-core>=1.3,<2.0",
  "omegaconf>=2.3,<3.0",
  "numpy>=1.26",
  "h5py>=3.10",
  "lightning>=2.4,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
