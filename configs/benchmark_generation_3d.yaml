run_dir: ???
output_root: /scratch/coop/theret/GraphAttention_runs/benchmark_3d
generated_tensor: generated_test.pt
overwrite: false
sample_space: nondimensional
eps: 1.0e-30
quantiles: [0.01, 0.05, 0.5, 0.95, 0.99]

spectra:
  num_k_bins: 24
  subtract_mean: true
  cartesian_tolerance: 1.0e-8
  # HIT_LES_FORCED stores both ends of each periodic axis: 33^3 nodes for 32^3 cells.
  # FFT statistics use the 32^3 unique periodic grid by dropping the max plane.
  periodic_endpoint_mode: drop_max
  bands:
    low: [0.0, 0.25]
    mid: [0.25, 0.5]
    high: [0.5, 1.0]

energy_spectrum:
  lower_quantile: 0.10
  upper_quantile: 0.90

nearest_reference:
  enabled: true
  include_channel_correlations: true
  normalization_eps: 1.0e-12

physics:
  enabled: true

plots:
  enabled: true
  marginals: true
  spectra: true
  energy_spectrum: true
  # Full-volume field rendering is intentionally deferred; statistics and spectra
  # operate on the complete 3-D volume.
  fields: false
  marginal_bins: 128
  dpi: 180
