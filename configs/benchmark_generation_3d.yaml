run_dir: ???
output_root: /scratch/coop/theret/GraphAttention_runs/benchmark_3d
generated_tensor: generated_test.pt
overwrite: false
sample_space: nondimensional
eps: 1.0e-30
quantiles: [0.01, 0.05, 0.5, 0.95, 0.99]

spectra:
  num_k_bins: 24
  subtract_mean: true
  cartesian_tolerance: 1.0e-8
  # HIT_LES_FORCED stores both ends of each periodic axis: 33^3 nodes for 32^3 cells.
  # FFT statistics use the 32^3 unique periodic grid by dropping the max plane.
  periodic_endpoint_mode: drop_max
  bands:
    low: [0.0, 0.25]
    mid: [0.25, 0.5]
    high: [0.5, 1.0]

energy_spectrum:
  lower_quantile: 0.10
  upper_quantile: 0.90

spatial_statistics:
  # On the unique 32^3 periodic grid, None evaluates lags 0..16 = L_box/2.
  max_lag: null
  lower_quantile: 0.10
  upper_quantile: 0.90

nearest_reference:
  enabled: true
  include_channel_correlations: true
  normalization_eps: 1.0e-12

physics:
  enabled: true

plots:
  enabled: true
  marginals: true
  spectra: true
  energy_spectrum: true
  # Visual sanity check: central x/y/z slices for a few unpaired real/generated volumes.
  fields: true
  # Also render all three orthogonal planes as one angled 3-D cutaway.
  # This is a 3-D visualization of slices, not volume rendering or isosurfaces.
  orthogonal_3d: true
  # Identical to the existing 2-D and 3-D slice colormap.
  field_cmap: RdBu_r
  field_examples: 3
  spatial_correlation: true
  structure_functions: true
  marginal_bins: 128
  dpi: 180
