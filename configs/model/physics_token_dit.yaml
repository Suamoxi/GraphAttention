# Independent Transolver-style Physics-Attention DiT baseline, NOT a DiNAT branch.
# Hydra infers in/out channels, coordinates and conditioning from the task probe.
_target_: graph_attention.models.physics_token_dit.PhysicsTokenDiTGraphTransformer
in_channels: 2
out_channels: 1
hidden_dim: 64
num_heads: 4
num_layers: 4
spatial_dim: 2
mlp_ratio: 4
conditioning_channels: 0
condition_embed_dim: 128
use_coord_mlp: true
coordinate_normalization: centered_bbox
coordinate_normalization_eps: 1.0e-8
use_sdpa: true
dropout: 0.0
qkv_bias: true
out_proj_bias: false
num_tokens: 64
slice_temperature: 0.5
# Null: dense [B,H,N,M] slicing, baseline. Positive integer: two-pass
# per-layer chunked slicing/deslicing, with recomputation; not CPU streaming.
token_chunk_size: null
