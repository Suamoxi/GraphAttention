_target_: graph_attention.models.dinat_dit.AlternatingDilatedGeometricDiT
in_channels: 2
out_channels: 1
hidden_dim: 64
num_heads: 4
num_layers: 4
spatial_dim: 2
mlp_ratio: 4
dropout: 0.0
conditioning_channels: 0
condition_embed_dim: 128
use_coord_mlp: true
# Controlled 2-D/3-D ablation: true reproduces all historic checkpoints.
# false bypasses the full-graph absolute-coordinate embedding entirely.
# Relative edge-displacement attention is always kept unchanged.
use_absolute_position_encoding: true
coordinate_normalization: centered_bbox
coordinate_normalization_eps: 1.0e-8
use_sdpa: true
qkv_bias: true
out_proj_bias: false
sparse_attention_backend: scatter  # scatter | torch_sparse | dgl
include_self_attention: false
# M43-B1b: optional per-block non-reentrant checkpointing (training only).
activation_checkpointing: false
